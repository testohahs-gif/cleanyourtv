plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jannek.jarvis'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jannek.jarvis'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.0'
    }

    // Fester Schlüssel: Updates lassen sich ab jetzt direkt über die installierte Version spielen.
    // Für ein privates, per ADB installiertes Gerät ist ein eingechecktes Schlüsselpaar in Ordnung.
    signingConfigs {
        debug {
            storeFile file('jarvis-debug.keystore')
            storePassword 'android'
            keyAlias 'jarvis'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
