plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jannek.jarvis'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jannek.jarvis'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
